<div class="card flex justify-center">
  <p-drawer
    #drawer
    [(visible)]="visible"
    header="{{ 'sidebar.header' | transloco }}"
  >
    <div class="flex flex-col h-full">
      <ul class="list-none px-4 py-0 m-0">
        @for (item of items; track item.labelKey) {
        <li class="rounded-lg overflow-hidden">
          <div
            pRipple
            class="flex items-center cursor-pointer p-4 gap-4 hover:bg-emerald-100"
            (click)="navigate(item, $event, drawer)"
          >
            <i class="{{ item.icon }} text-gray-500 text-xl"></i>
            <span class="font-medium"> {{ item.labelKey | transloco }} </span>
          </div>
        </li>
        }
      </ul>
    </div>
  </p-drawer>
</div>
<button
  pButton
  type="button"
  size="large"
  iconOnly
  class="fixed top-0 left-0 m-4 z-50 shadow-xl"
  (click)="visible.set(true)"
>
  <svg data-p-icon="bars" [size]="20"></svg>
</button>
