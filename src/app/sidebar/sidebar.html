<div class="card flex justify-center">
  <p-drawer [(visible)]="visible" header="{{ 'sidebar.header' | transloco }}">
    <div class="flex flex-col h-full">
      <ul class="list-none px-4 py-0 m-0">
        @for (item of items; track item.label) {
        <li class="rounded-lg overflow-hidden">
          <div
            pRipple
            class="flex items-baseline cursor-pointer p-4 gap-4 hover:bg-emerald-100"
          >
            <i [class]="item.icon + ' text-gray-500'"></i>
            <span class="font-medium"> {{ item.label }} </span>
          </div>
        </li>
        }
      </ul>
    </div>
  </p-drawer>
  <button
    pButton
    iconOnly
    class="fixed top-0 left-0 m-4 z-50 shadow-xl"
    (click)="visible = true"
  >
    <svg data-p-icon="bars"></svg>
  </button>
</div>
